name: Build Android APK (EuroAsia CRM)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 🟢 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Cordova
        run: npm install -g cordova@11.0.0

      - name: 🤖 Add Android Platform
        run: |
          cordova platform add android@11.0.0
          cordova prepare android

      - name: 🔨 Build Android Debug APK
        run: cordova build android --debug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EuroAsia-CRM-Android-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🎉 Summary
        run: |
          echo "### ✅ APK Tayyor!" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts bo'limidan **EuroAsia-CRM-Android-APK** ni yuklab oling." >> $GITHUB_STEP_SUMMARY
