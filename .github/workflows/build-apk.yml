name: Build Android APK (EuroAsia CRM)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Capacitor CLI
        run: |
          npm install -g @capacitor/cli@latest
          npm install @capacitor/core@latest @capacitor/android@latest

      - name: ⚙️ Initialize Capacitor & Sync Web App
        run: |
          npx cap init "EuroAsia CRM" "uz.euroasia.crm" --web-dir www
          npx cap add android
          npx cap sync android

      - name: 🔨 Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuroAsia-CRM-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🎉 Summary
        run: |
          echo "### 📱 Android APK Muvaffaqiyatli Yaratildi!" >> $GITHUB_STEP_SUMMARY
          echo "Yuklab olish uchun **Artifacts** bo'limida \`EuroAsia-CRM-Android-APK\` tugmasini bosing." >> $GITHUB_STEP_SUMMARY
