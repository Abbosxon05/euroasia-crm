name: Build Android APK (EuroAsia CRM)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Apache Cordova CLI
        run: |
          npm install -g cordova@12.0.0
          npm install --save cordova-android@13.0.0

      - name: 🤖 Add Android Platform & Prepare
        run: |
          cordova platform add android@13.0.0
          cordova prepare android

      - name: 🔨 Build Android Debug APK
        run: |
          cordova build android --debug

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuroAsia-CRM-Android-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🎉 Summary
        run: |
          echo "### APK Tayyor!" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts dan EuroAsia-CRM-Android-APK ni yuklab oling." >> $GITHUB_STEP_SUMMARY
