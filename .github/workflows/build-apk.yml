name: Build Android APK (EuroAsia CRM)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      debug_build:
        description: 'Build Debug APK'
        required: true
        default: 'true'

jobs:
  build-android-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Apache Cordova CLI & Dependencies
        run: |
          npm install -g cordova@12.0.0
          npm install

      - name: 🤖 Add Android Platform & Prepare
        run: |
          cordova platform add android@13.0.0 --save
          cordova prepare android

      - name: 🔨 Build Android Debug APK
        run: |
          cordova build android --debug

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuroAsia-CRM-Android-APK
          path: |
            platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🎉 Summary
        run: |
          echo "### 📱 Android APK Muvaffaqiyatli Yaratildi!" >> $GITHUB_STEP_SUMMARY
          echo "Yuklab olish uchun yuqoridagi **Artifacts** bo'limida \`EuroAsia-CRM-Android-APK\` ustiga bosing." >> $GITHUB_STEP_SUMMARY
